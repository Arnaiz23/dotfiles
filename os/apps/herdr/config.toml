onboarding = false

[ui.toast]
delivery = "system"

[ui]
status_indicators = "symbols"

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+space"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"
